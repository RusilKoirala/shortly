services:
  - type: web
    name: shortly-backend
    repo: https://github.com/rusilkoirala/shortly
    branch: main
    root: backend
    runtime: node
    region: Singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - name: MONGO_URI
        value: "mongodb+srv://admin:123@cluster0.2ccdwmf.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0"
        sensitive: true
      - name: JWT_SECRET
        value: "ilvu"
        sensitive: true
      - name: CLIENT_URL
        value: "https://projectshortly.netlify.app"
        sensitive: false
      - name: NODE_ENV
        value: "production"
        sensitive: false
      - name: COOKIE_DOMAIN
        value: "https://projectshortly.netlify.app"
        sensitive: true

# Notes:
# - Replace `repo` with your repository URL.
# - This blueprint deploys the `backend` folder as the service root. Render will run the
#   build and start commands inside the `backend` folder.
# - If you prefer to deploy the repo root, set `root: .` and change `startCommand` to
#   `npm --prefix backend start` or set an equivalent Start Command in the Render dashboard.
